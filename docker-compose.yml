version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: ecommerce-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-adminpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-ecommerce}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASS:-adminpassword}@mongo:27017/${MONGO_DB_NAME:-ecommerce}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-change_this_secret}
    networks:
      - ecommerce-net
    volumes:
      - ./backend:/app
      
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - ecommerce-net

  health-checker:
    build:
      context: ./health-checker
      dockerfile: Dockerfile
    container_name: ecommerce-health-checker
    restart: unless-stopped
    depends_on:
      - backend
      - mongo
    environment:
      HEALTH_CHECK_URL: http://backend:5000/api/health
      TARGET_CONTAINER_NAME: ecommerce-backend
      CHECK_INTERVAL_SECONDS: 30
      FAILURE_THRESHOLD: ${FAILURE_THRESHOLD:-2}
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASS:-adminpassword}@mongo:27017/${MONGO_DB_NAME:-ecommerce}?authSource=admin
      MONGO_DB_NAME: ${MONGO_DB_NAME:-ecommerce}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_FROM_EMAIL: ${ALERT_FROM_EMAIL:-${SMTP_USERNAME:-}}
      ALERT_TO_EMAILS: ${ALERT_TO_EMAILS:-}
      DOCKER_MODE: sdk
    volumes:
      # Grants access to the Docker Engine so the checker can restart other containers
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9200:9200" # Prometheus metrics endpoint (Module 6)
    networks:
      - ecommerce-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ecommerce-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - ecommerce-net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ecommerce-prometheus
    restart: unless-stopped
    depends_on:
      - health-checker
      - cadvisor
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - ecommerce-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ecommerce-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    driver: bridge

volumes:
  mongo-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
